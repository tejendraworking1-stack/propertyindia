name: Unpack zip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and move files
        run: |
          unzip -q ./*.zip -d _tmp
          rm -rf _tmp/propertyindia/.github
          cp -a _tmp/propertyindia/. .
          rm -rf _tmp ./*.zip
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Unpack Phase 1 files"
          git push
