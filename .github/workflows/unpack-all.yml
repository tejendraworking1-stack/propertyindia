name: Unpack all zips
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and move files
        run: |
          for z in ./*.zip; do unzip -q -o "$z" -d _tmp; done
          rm -rf _tmp/propertyindia/.github
          cp -a _tmp/propertyindia/. .
          rm -rf _tmp ./*.zip
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Unpack Part 2 (full original)"
          git push
