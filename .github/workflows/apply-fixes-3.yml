name: Apply fixes 3
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: |
          python3 - <<'PYEOF'
          import pathlib, re

          # 1) home.css: the original's global element rules are ALREADY present, identical, inside @layer base in
          #    app/globals.css. Their unlayered duplicates in home.css beat every Tailwind utility (utilities are layered),
          #    e.g. svg{width:1.25em} overrides w-7/size-10. Remove only those exact duplicate lines.
          p = pathlib.Path("app/home.css")
          lines = p.read_text().split("\n")
          g = re.sub(r"\s+", "", pathlib.Path("app/globals.css").read_text())
          dups = [
           "*,*::before,*::after{box-sizing:border-box}",
           "html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px);scroll-behavior:smooth}",
           "body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;}",
           "a{color:inherit;text-decoration:none}",
           "button{font:inherit;cursor:pointer;border:0;color:inherit}",
           "svg{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}",
           ":focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:6px}",
          ]
          for d in dups:
              assert lines.count(d) == 1, f"line not found exactly once in home.css: {d[:50]}"
              sel, body = d.split("{", 1)
              for decl in [x for x in body.rstrip("}").split(";") if x.strip()]:
                  assert re.sub(r"\s+", "", decl) in g, f"declaration not in globals.css base layer: {decl}"
          lines = [l for l in lines if l not in dups]
          p.write_text("\n".join(lines)); print("patched app/home.css (removed", len(dups), "duplicate lines)")

          # 2) Next.js dev-mode badge (round 'N' button) is drawn over the page in `next dev` and shows up in screenshots
          c = pathlib.Path("next.config.ts"); s = c.read_text()
          assert s.count("reactStrictMode: true,") == 1
          c.write_text(s.replace("reactStrictMode: true,", "reactStrictMode: true,\n  devIndicators: false,")); print("patched next.config.ts")
          PYEOF
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix: stop home.css overriding Tailwind utilities; hide Next dev badge"
          git push
