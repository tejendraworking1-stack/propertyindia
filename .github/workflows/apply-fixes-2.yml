name: Apply fixes 2
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: |
          python3 - <<'PYEOF'
          import pathlib
          def sub(path, old, new):
              p = pathlib.Path(path); s = p.read_text()
              assert s.count(old) == 1, f"NOT FOUND (or not unique) in {path}: {old[:60]}"
              p.write_text(s.replace(old, new)); print("patched", path)

          # 1) Production build shortens #ffffff to #fff (same colour): compare hex colours in a normalised form
          sub("scripts/tests/foundation.mjs",
              "const EXPECT_VARS = {",
              'const hex = (x) => (typeof x === "string" ? x.trim().toLowerCase().replace(/^#([0-9a-f])([0-9a-f])([0-9a-f])$/, "#$1$1$2$2$3$3") : x);\nconst EXPECT_VARS = {')
          sub("scripts/tests/foundation.mjs", "m.vars[k] === v,", "hex(m.vars[k]) === hex(v),")

          # 2) Cascade-layer check: the minified CSS has no 'theme, base, components, utilities' statement,
          #    so test what matters: utilities must come after theme and base in the compiled CSS
          p = pathlib.Path("scripts/tests/tailwind4.mjs")
          lines = p.read_text().split("\n")
          idx = [i for i, l in enumerate(lines) if l.startswith('check("cascade layers declared')]
          assert len(idx) == 1, "layer check line not found"
          lines[idx[0]] = (
           'const layerOrder = [...new Set([...built.matchAll(/@layer\\s+([a-z][a-z0-9-]*(?:\\s*,\\s*[a-z][a-z0-9-]*)*)\\s*[{;]/g)].flatMap((m) => m[1].split(/\\s*,\\s*/)))];\n'
           'check("cascade layer order: utilities come after theme and base", layerOrder.includes("utilities") && layerOrder.indexOf("utilities") > layerOrder.indexOf("theme") && (!layerOrder.includes("base") || layerOrder.indexOf("utilities") > layerOrder.indexOf("base")), "order found: " + layerOrder.join(" > "));'
          )
          p.write_text("\n".join(lines)); print("patched scripts/tests/tailwind4.mjs")
          PYEOF
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix hex token check and cascade layer check"
          git push
